plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.architectury.dev/" }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Compile-time only: needed so mixins can reference FTB Quests / FTB Library classes.
    // Resolved from CurseMaven (CurseForge files). None of these are bundled into the built jar.
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:0.83.1+1.20.1"
    modCompileOnly "dev.architectury:architectury-fabric:9.1.12"
    modCompileOnly("curse.maven:ftb-library-fabric-438495:6164052") { transitive = false }  // FTB Library 2001.2.9
    modCompileOnly("curse.maven:ftb-teams-fabric-438497:7499808") { transitive = false }    // FTB Teams 2001.3.2
    modCompileOnly("curse.maven:ftb-quests-fabric-438496:6829211") { transitive = false }   // FTB Quests 2001.4.14
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
